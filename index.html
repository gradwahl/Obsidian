<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidian — PS5 Homebrew Store & Katalogi</title>
    <meta name="description" content="TV Netflix-style homebrew catalog interface and Katalogi client for PlayStation 5 and Linux desktop." />
    <meta property="og:title" content="Obsidian — PS5 Homebrew Store & Katalogi" />
    <meta property="og:description" content="TV Netflix-style homebrew catalog interface and Katalogi client for PlayStation 5 and Linux desktop." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      @-webkit-keyframes obsidian-boot-spin {
        from { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
        to { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
      }
      @keyframes obsidian-boot-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .obsidian-boot-spinner {
        display: block; box-sizing: border-box;
        width: 48px; height: 48px; margin: 26px auto;
        border: 4px solid #35363c; border-top-color: #e50924;
        border-radius: 50%;
        -webkit-animation: obsidian-boot-spin .85s linear infinite;
        animation: obsidian-boot-spin .85s linear infinite;
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        will-change: transform;
      }
      @media (prefers-reduced-motion: reduce) {
        .obsidian-boot-spinner {
          -webkit-animation-duration: 2s;
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body class="bg-[#08080a] text-white overflow-hidden select-none antialiased font-sans">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08080a;color:#fff;font:20px sans-serif;text-align:center;padding:32px;box-sizing:border-box">
        <div>
          <strong style="font-size:28px;letter-spacing:2px">OBSIDIAN</strong>
          <div class="obsidian-boot-spinner" role="status" aria-label="Loading"></div>
          <div style="font-size:16px;color:#eaeaea">Starting Obsidian...</div>

        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
