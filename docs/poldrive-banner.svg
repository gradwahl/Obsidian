        <path d="M15 147 Q60 44 144 33" stroke="#75a5c4" stroke-opacity=".25" stroke-width="16" fill="none"/>
        <circle cx="81" cy="90" r="39" stroke="#a0c8df" stroke-opacity=".24" stroke-width="3" fill="none"/>
        <rect x="15" y="170" width="83" height="8" rx="4" fill="#fff" opacity=".65"/>
        <rect x="15" y="186" width="109" height="6" rx="3" fill="#fff" opacity=".23"/>
      </g>
      <g transform="translate(902 43) rotate(6 78 112)">
