        <circle cx="79" cy="90" r="49" fill="none" stroke="#ed7084" stroke-opacity=".39" stroke-width="11"/>
        <path d="M0 148 L156 64 M0 173 L156 88" stroke="#f3a7b2" stroke-opacity=".1" stroke-width="17"/>
