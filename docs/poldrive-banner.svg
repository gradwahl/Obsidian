<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Poldrive</title>
  <desc id="desc">Dark console-inspired banner with a red P icon and stylized game covers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171821"/>
      <stop offset="0.6" stop-color="#101117"/>
      <stop offset="1" stop-color="#090a0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1015 164) rotate(180) scale(440 300)">
      <stop stop-color="#e50914" stop-opacity=".26"/>
      <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2c3447"/>
      <stop offset=".55" stop-color="#10151f"/>
      <stop offset="1" stop-color="#8c111f"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#641826"/>
      <stop offset=".6" stop-color="#1c1420"/>
      <stop offset="1" stop-color="#11131a"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#213a4b"/>
      <stop offset=".5" stop-color="#151b25"/>
      <stop offset="1" stop-color="#12131a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
